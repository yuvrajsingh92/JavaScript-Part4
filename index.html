<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Image Loading Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Lazy Image Loading</h1>

    <main class="image-container">
      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1015/800/500"
          alt="Mountain landscape"
        />
      </div>

      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1016/800/500"
          alt="Mountain and lake"
        />
      </div>

      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1025/800/500"
          alt="Dog"
        />
      </div>

      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1035/800/500"
          alt="River landscape"
        />
      </div>

      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1043/800/500"
          alt="Forest"
        />
      </div>

      <div class="image-card">
        <img
          class="lazy-image"
          data-src="https://picsum.photos/id/1069/800/500"
          alt="Beach"
        />
      </div>
    </main>

    <script src="2_performance_Optimization.js"></script>
  </body>
</html>
